<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- statusgumbo.svg for Android's adaptive icons: the tile runs to the edge,
       because the launcher cuts its own shape out of it, and the artwork is
       scaled to 75% so all of it falls inside the central safe circle. -->
  <rect width="64" height="64" fill="#059669"/>
  <g transform="translate(32 32) scale(0.75) translate(-32 -35)">
    <path d="M10 26h11l4-9 6 17 5-13 3 5h15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12" y="36" width="40" height="4" rx="2" fill="#fff"/>
    <path d="M14 40 C14 40 13 54 32 54 51 54 50 40 50 40 Z" fill="#fff"/>
    <path d="M12 40c-4 0-6 2.5-6 5s2 5 6 5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M52 40c4 0 6 2.5 6 5s-2 5-6 5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
